name: Build mlbb-esp-ksu by ZYDARK ERROR

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Force write license files
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n8933bad161af4b6a5b573652ffc7aaf3aee85a47" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131b33910" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/google-tv-preview-license
          echo -e "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > $ANDROID_HOME/licenses/android-googletv-license
          echo -e "\ne9acab5b5fbb560a72cfaecce8946896ff6aab9d" > $ANDROID_HOME/licenses/mips-android-sysimage-license

      - name: Install NDK 26.1 and build-tools
        run: |
          sdkmanager "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/26.1.10909125" >> local.properties

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Make build script executable
        run: chmod +x build_and_package.sh

      - name: Set module author
        run: |
          find . -name "module.prop" -exec sed -i 's/^author=.*/author=ZYDARK ERROR/' {} \;

      - name: Run build script
        run: bash build_and_package.sh

      - name: Upload module zip (ZYDARK ERROR)
        uses: actions/upload-artifact@v4
        with:
          name: mlbb-esp-ksu-ZYDARK-ERROR
          path: mlbb_esp_ksu.zip
