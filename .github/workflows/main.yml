name: Build mlbb-esp-ksu by ZYDARK ERROR

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK packages directly
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "ndk;26.1.10909125" \
            "build-tools;34.0.0" \
            "platforms;android-34"

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/26.1.10909125" >> local.properties

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Make build script executable
        run: chmod +x build_and_package.sh

      - name: Set module author
        run: |
          find . -name "module.prop" -exec sed -i 's/^author=.*/author=ZYDARK ERROR/' {} \;

      - name: Run build script
        run: bash build_and_package.sh

      - name: Upload module zip (ZYDARK ERROR)
        uses: actions/upload-artifact@v4
        with:
          name: mlbb-esp-ksu-ZYDARK-ERROR
          path: mlbb_esp_ksu.zip
